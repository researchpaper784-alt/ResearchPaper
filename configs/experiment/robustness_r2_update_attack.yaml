# Phase 8, R2 -- Gaussian and sign-flip update attackers at 10%/20%/30% of clients
# (fl/app.py's corrupt_update, applied post-training to the designated attacker
# subset's reported weights). Tests the norm-ratio (r_k) heuristic (aco/heuristics.py)
# specifically -- a corrupted update should show up as an outlier in update
# magnitude/direction relative to the median client.
#
# Run: .venv/bin/python scripts/run_sweep.py --config configs/experiment/robustness_r2_update_attack.yaml

base_overrides:
  num-clients: 20
  min-client-size: 5
  fraction-train: 1.0
  min-train-nodes: 2
  min-evaluate-nodes: 2
  min-available-nodes: 2
  model-name: simple_cnn
  model-pretrained: false
  model-norm: groupnorm
  image-size: 112
  local-epochs: 2
  local-lr: 0.01
  local-batch-size: 32
  num-rounds: 100
  deterministic: true
  attack-scale: 0.5
  regime: dirichlet
  alpha: 0.3

strategies:
  - name: fedavg
    file: configs/strategy/fedavg.yaml
  - name: krum
    overrides: {strategy-name: krum, num-malicious-nodes: 4}  # see robustness_r1's comment on this fixed assumption
  - name: trimmed_mean
    file: configs/strategy/trimmed_mean.yaml
  - name: fedaco
    file: configs/strategy/fedaco.yaml

partitions:
  - name: gaussian_10pct
    overrides: {attack: gaussian, attack-fraction: 0.10}
  - name: gaussian_20pct
    overrides: {attack: gaussian, attack-fraction: 0.20}
  - name: gaussian_30pct
    overrides: {attack: gaussian, attack-fraction: 0.30}
  - name: sign_flip_10pct
    overrides: {attack: sign_flip, attack-fraction: 0.10}
  - name: sign_flip_20pct
    overrides: {attack: sign_flip, attack-fraction: 0.20}
  - name: sign_flip_30pct
    overrides: {attack: sign_flip, attack-fraction: 0.30}

# 8 seeds, raised from 3. The signed-rank test's p-value floor is set by the pair
# count alone: at 3 seeds the smallest two-sided p it can return is 0.2500, so this
# sweep could not produce a significant result at alpha=0.05 under any data. 8 seeds moves
# the floor to 0.0078. See docs/OPEN_QUESTIONS.md, "5 seeds cannot produce a significant
# result", and `analysis.seeds_needed_for` for the family-size dependence.
seeds: [0, 1, 2, 3, 4, 5, 6, 7]
