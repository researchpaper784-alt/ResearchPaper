# Phase 8, R2 -- Gaussian and sign-flip update attackers at 10%/20%/30% of clients
# (fl/app.py's corrupt_update, applied post-training to the designated attacker
# subset's reported weights). Tests the norm-ratio (r_k) heuristic (aco/heuristics.py)
# specifically -- a corrupted update should show up as an outlier in update
# magnitude/direction relative to the median client.
#
# Run: .venv/bin/python scripts/run_sweep_granular.py --config configs/experiment/robustness_r2_update_attack.yaml

base_overrides:
  num-clients: 20
  min-client-size: 5
  fraction-train: 1.0
  min-train-nodes: 2
  min-evaluate-nodes: 2
  min-available-nodes: 2
  model-name: simple_cnn
  model-pretrained: false
  model-norm: groupnorm
  image-size: 112
  local-epochs: 2
  local-lr: 0.01
  local-batch-size: 32
  num-rounds: 100
  deterministic: true
  attack-scale: 0.5
  regime: dirichlet
  alpha: 0.3

strategies:
  - name: fedavg
    file: configs/strategy/fedavg.yaml
  - name: krum
    # `num-malicious-nodes` is deliberately NOT set: the factory derives Krum's f from
    # this cell's own `attack-fraction` via the same `attacks.malicious_ids` the clients
    # use, so the number Krum assumes and the number that actually lie cannot drift.
    # It was hardcoded to 4 (20% of 20), which tuned Krum correctly in one of the three
    # attacker-fraction cells and mis-tuned it in the other two -- flattering FedACO in
    # the comparison the paper's Byzantine-resilience claim rests on.
    overrides: {strategy-name: krum}
  - name: trimmed_mean
    file: configs/strategy/trimmed_mean.yaml
  - name: fedaco
    file: configs/strategy/fedaco.yaml

partitions:
  - name: gaussian_10pct
    overrides: {attack: gaussian, attack-fraction: 0.10}
  - name: gaussian_20pct
    overrides: {attack: gaussian, attack-fraction: 0.20}
  - name: gaussian_30pct
    overrides: {attack: gaussian, attack-fraction: 0.30}
  - name: sign_flip_10pct
    overrides: {attack: sign_flip, attack-fraction: 0.10}
  - name: sign_flip_20pct
    overrides: {attack: sign_flip, attack-fraction: 0.20}
  - name: sign_flip_30pct
    overrides: {attack: sign_flip, attack-fraction: 0.30}

# 5 seeds, deliberately. These sweeps are read as *descriptions* -- which component
# carries the result, how performance degrades under attack -- and effect sizes and
# degradation curves carry that without a significance test. The 8-seed floor is
# reserved for the two places a p-value is actually claimed: main.yaml's headline
# comparison and ablation_a1's ACO-vs-random-search control. Raising these too costs
# ~640 cells and strengthens no claim in the paper.
#
# ⚠️ If a claim of the form "X significantly beats Y" ends up resting on this sweep,
# it needs 8 seeds like the others -- `make tables` prints the requirement for
# whatever family the table contains. See docs/OPEN_QUESTIONS.md.
seeds: [0, 1, 2, 3, 4]
