# Phase 8, R4 -- differential-privacy noise on every client's update, at several
# sigma values (fl/app.py's apply_dp_noise -- applies to ALL clients regardless of
# attacker status, an honest privacy mechanism, not an attack). Answers "does your
# method survive DP noise?" -- the standard rebuttal-killer question for any FL
# paper that inspects raw updates.
#
# Run: .venv/bin/python scripts/run_sweep.py --config configs/experiment/robustness_r4_dp_noise.yaml

base_overrides:
  num-clients: 20
  min-client-size: 5
  fraction-train: 1.0
  min-train-nodes: 2
  min-evaluate-nodes: 2
  min-available-nodes: 2
  model-name: simple_cnn
  model-pretrained: false
  model-norm: groupnorm
  image-size: 112
  local-epochs: 2
  local-lr: 0.01
  local-batch-size: 32
  num-rounds: 100
  deterministic: true
  regime: dirichlet
  alpha: 0.3

strategies:
  - name: fedavg
    file: configs/strategy/fedavg.yaml
  - name: fedaco
    file: configs/strategy/fedaco.yaml

partitions:
  - name: sigma=0.0_control
    overrides: {dp-noise-sigma: 0.0}
  - name: sigma=0.01
    overrides: {dp-noise-sigma: 0.01}
  - name: sigma=0.05
    overrides: {dp-noise-sigma: 0.05}
  - name: sigma=0.1
    overrides: {dp-noise-sigma: 0.1}

# 8 seeds, raised from 3. The signed-rank test's p-value floor is set by the pair
# count alone: at 3 seeds the smallest two-sided p it can return is 0.2500, so this
# sweep could not produce a significant result at alpha=0.05 under any data. 8 seeds moves
# the floor to 0.0078. See docs/OPEN_QUESTIONS.md, "5 seeds cannot produce a significant
# result", and `analysis.seeds_needed_for` for the family-size dependence.
seeds: [0, 1, 2, 3, 4, 5, 6, 7]
