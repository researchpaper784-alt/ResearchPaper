# Phase 8, R4 -- differential-privacy noise on every client's update, at several
# sigma values (fl/app.py's apply_dp_noise -- applies to ALL clients regardless of
# attacker status, an honest privacy mechanism, not an attack). Answers "does your
# method survive DP noise?" -- the standard rebuttal-killer question for any FL
# paper that inspects raw updates.
#
# Run: .venv/bin/python scripts/run_sweep_granular.py --config configs/experiment/robustness_r4_dp_noise.yaml

base_overrides:
  # Where results land. Without this the run falls through to pyproject's `output-dir`
  # (`results/fl`), where `make tables-robustness` does not look -- so a finished sweep would
  # produce an empty table, and every granular sweep would share one directory. Added
  # 2026-09-24; the three aggregate configs (main/robustness/ablation_all) already did this.
  output-dir: results/fl/robustness
  num-clients: 20
  min-client-size: 5
  fraction-train: 1.0
  min-train-nodes: 2
  min-evaluate-nodes: 2
  min-available-nodes: 2
  model-name: simple_cnn
  model-pretrained: false
  model-norm: groupnorm
  image-size: 112
  local-epochs: 2
  local-lr: 0.01
  local-batch-size: 32
  num-rounds: 100
  deterministic: true
  regime: dirichlet
  alpha: 0.3

strategies:
  - name: fedavg
    file: configs/strategy/fedavg.yaml
  - name: fedaco
    file: configs/strategy/fedaco.yaml

partitions:
  - name: sigma=0.0_control
    overrides: {dp-noise-sigma: 0.0}
  - name: sigma=0.01
    overrides: {dp-noise-sigma: 0.01}
  - name: sigma=0.05
    overrides: {dp-noise-sigma: 0.05}
  - name: sigma=0.1
    overrides: {dp-noise-sigma: 0.1}

# 5 seeds, deliberately. These sweeps are read as *descriptions* -- which component
# carries the result, how performance degrades under attack -- and effect sizes and
# degradation curves carry that without a significance test. The 8-seed floor is
# reserved for the two places a p-value is actually claimed: main.yaml's headline
# comparison and ablation_a1's ACO-vs-random-search control. Raising these too costs
# ~640 cells and strengthens no claim in the paper.
#
# ⚠️ If a claim of the form "X significantly beats Y" ends up resting on this sweep,
# it needs 8 seeds like the others -- `make tables` prints the requirement for
# whatever family the table contains. See docs/OPEN_QUESTIONS.md.
seeds: [0, 1, 2, 3, 4]
