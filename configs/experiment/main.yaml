# Phase 6 -- the main sweep.
#
# The full factorial is strategies x regimes x seeds. At the values below that is
# 11 x 6 x 5 = 330 runs, which is the plan's own main table and is exactly the size
# docs/EXPERIMENT_LOG.md's 2026-09-14 entry costed out as infeasible on the available
# hardware. That entry's numbers are estimates and it says so in bold; run
# `python scripts/run_sweep.py --config configs/experiment/main.yaml --dry-run` to get a
# projection from a *measured* per-round cost instead, and scale `seeds` or `regimes`
# down until it fits the quota you actually have.
#
# Trim honestly if you must: dropping seeds costs error bars, dropping regimes costs
# coverage, dropping strategies costs the comparison. Dropping FedAvg is never an option
# -- it is the reference every claim is relative to.

name: main

# Every strategy in strategies/factory.py. FedACO is the method; the rest are the
# baselines it is compared against, each already given an honest per-baseline
# hyperparameter search (scripts/run_hparam_search.py, Phase 5).
strategies:
  - fedavg
  - fedprox
  - fedadam
  - fedyogi
  - krum
  - trimmed-mean
  - median
  - fednova
  - loss-based
  - scaffold
  - fedlaw
  - fedaco

# The partition regimes characterized in Phase 1.4, with their measured heterogeneity
# (JS divergence / size Gini) recorded in docs/EXPERIMENT_LOG.md. Names match
# scripts/make_partition_figures.py::REGIMES so figures and results line up.
#
# `iid` is the control and is also what scripts/check_iid_band.py gates on: with almost
# no heterogeneity to exploit, every strategy should land in a narrow band, and a large
# spread means something other than the method is driving it.
regimes:
  - name: iid
    regime: iid
  - name: dirichlet_0.1
    regime: dirichlet
    alpha: 0.1
  - name: dirichlet_0.3
    regime: dirichlet
    alpha: 0.3
  - name: pathological_2
    regime: pathological
    classes-per-client: 2
  # quantity_skew is the regime to watch: it attacks FedAvg's n_k weighting directly,
  # which is precisely what FedSwarm replaces (docs/EXPERIMENT_LOG.md, Phase 1.4).
  - name: quantity_skew
    regime: quantity_skew
    skew-sigma: 1.0
  - name: source_shift
    regime: source_shift

seeds: [0, 1, 2, 3, 4]

# Shared run settings. Anything here can be overridden per-regime above, and anything
# declared in pyproject.toml's [tool.flwr.app.config] can be added -- but only what is
# declared there, since `flwr run` rejects unknown keys with a bare "[code: 15]".
common:
  num-clients: 20
  num-rounds: 100
  local-epochs: 1
  local-lr: 0.01
  local-batch-size: 32
  model-name: simple_cnn
  model-norm: groupnorm
  image-size: 112
  output-dir: results/fl/main
