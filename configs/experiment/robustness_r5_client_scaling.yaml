# Phase 8, R5 -- client-count scaling: K in {10, 20, 50, 100}. Verifies the O(K^2)
# ACO overhead claim empirically -- pair with configs/experiment/overhead.yaml
# (a denser K sweep purpose-built for fitting/plotting the K^2 curve, plan §9.2's
# figure 5); this file uses the plan's own R5 values for the robustness-suite table.
#
# Run: .venv/bin/python scripts/run_sweep.py --config configs/experiment/robustness_r5_client_scaling.yaml

base_overrides:
  min-client-size: 5
  fraction-train: 1.0
  min-evaluate-nodes: 2
  min-available-nodes: 2
  model-name: simple_cnn
  model-pretrained: false
  model-norm: groupnorm
  image-size: 112
  local-epochs: 2
  local-lr: 0.01
  local-batch-size: 32
  num-rounds: 100
  deterministic: true
  regime: iid
  strategy-name: fedaco

strategies:
  - name: k=10
    overrides: {num-clients: 10, min-train-nodes: 2}
  - name: k=20
    overrides: {num-clients: 20, min-train-nodes: 2}
  - name: k=50
    overrides: {num-clients: 50, min-train-nodes: 2}
  - name: k=100
    overrides: {num-clients: 100, min-train-nodes: 2}

partitions:
  - name: iid
    overrides: {}

seeds: [0, 1, 2]
