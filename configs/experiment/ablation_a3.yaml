# Phase 7, A3 -- fitness mode: data_free (the method as proposed) vs. server_val (the
# upper-bound oracle-ish reference; needs a server-held val set). client_probe is
# excluded -- its broadcast/collect round-trip isn't wired for live execution yet
# (docs/OPEN_QUESTIONS.md's Phase 4 entry; selecting it raises NotImplementedError).
#
# ⚠️ Cost asymmetry, exactly as the plan warns (§4.4): server_val materializes a full
# model per candidate and runs a forward pass, "orders of magnitude more expensive"
# than data_free's O(K) Gram-trick evaluations. The server_val entry below therefore
# runs at a heavily reduced colony budget (A=8, I=3, the plan's own suggested
# reduction) -- comparing it against data_free at data_free's normal budget, not
# the same budget. Report that budget difference alongside any results table built
# from this ablation; do not present the two rows as apples-to-apples cost-wise.
#
# Run: .venv/bin/python scripts/run_sweep.py --config configs/experiment/ablation_a3.yaml

base_overrides:
  num-clients: 20
  min-client-size: 5
  fraction-train: 1.0
  min-train-nodes: 2
  min-evaluate-nodes: 2
  min-available-nodes: 2
  model-name: simple_cnn
  model-pretrained: false
  model-norm: groupnorm
  image-size: 112
  local-epochs: 2
  local-lr: 0.01
  local-batch-size: 32
  num-rounds: 100
  deterministic: true
  strategy-name: fedaco

strategies:
  - name: data_free
    overrides: {aco-fitness-mode: data_free}
  - name: server_val
    overrides:
      aco-fitness-mode: server_val
      aco-ants-start: 8
      aco-ants-end: 8
      aco-iters-start: 3
      aco-iters-end: 3

partitions:
  - name: iid
    file: configs/data/iid.yaml
  - name: dirichlet_0.3
    file: configs/data/dirichlet_0.3.yaml

# 5 seeds, deliberately. These sweeps are read as *descriptions* -- which component
# carries the result, how performance degrades under attack -- and effect sizes and
# degradation curves carry that without a significance test. The 8-seed floor is
# reserved for the two places a p-value is actually claimed: main.yaml's headline
# comparison and ablation_a1's ACO-vs-random-search control. Raising these too costs
# ~640 cells and strengthens no claim in the paper.
#
# ⚠️ If a claim of the form "X significantly beats Y" ends up resting on this sweep,
# it needs 8 seeds like the others -- `make tables` prints the requirement for
# whatever family the table contains. See docs/OPEN_QUESTIONS.md.
seeds: [0, 1, 2, 3, 4]
