# Phase 7, A8 -- adaptive vs. fixed colony budget. Supports the overhead claim (C3):
# does decaying (ants, iterations) across rounds (aco/schedules.py::colony_budget,
# "aggregation choice matters most early") actually help relative to spending the
# same total budget at a constant rate?
#
# "Fixed" here is implemented by setting ants-start=ants-end and iters-start=iters-
# end -- colony_budget's linear interpolation between two equal endpoints is, by
# construction, non-decaying -- no new code needed, just equal start/end values.
# The fixed arm's constant budget (20 ants x 7 iters = 140/round) is chosen close to
# the adaptive default's time-averaged budget over 100 rounds, for a fair total-
# evaluations comparison across the run, not just any arbitrary constant.
#
# Run: .venv/bin/python scripts/run_sweep_granular.py --config configs/experiment/ablation_a8.yaml

base_overrides:
  num-clients: 20
  min-client-size: 5
  fraction-train: 1.0
  min-train-nodes: 2
  min-evaluate-nodes: 2
  min-available-nodes: 2
  model-name: simple_cnn
  model-pretrained: false
  model-norm: groupnorm
  image-size: 112
  local-epochs: 2
  local-lr: 0.01
  local-batch-size: 32
  num-rounds: 100
  deterministic: true
  strategy-name: fedaco

strategies:
  - name: adaptive_default
    overrides: {aco-ants-start: 30, aco-ants-end: 10, aco-iters-start: 10, aco-iters-end: 4}
  - name: fixed
    overrides: {aco-ants-start: 20, aco-ants-end: 20, aco-iters-start: 7, aco-iters-end: 7}

partitions:
  - name: iid
    file: configs/data/iid.yaml
  - name: dirichlet_0.3
    file: configs/data/dirichlet_0.3.yaml

# 5 seeds, deliberately. These sweeps are read as *descriptions* -- which component
# carries the result, how performance degrades under attack -- and effect sizes and
# degradation curves carry that without a significance test. The 8-seed floor is
# reserved for the two places a p-value is actually claimed: main.yaml's headline
# comparison and ablation_a1's ACO-vs-random-search control. Raising these too costs
# ~640 cells and strengthens no claim in the paper.
#
# ⚠️ If a claim of the form "X significantly beats Y" ends up resting on this sweep,
# it needs 8 seeds like the others -- `make tables` prints the requirement for
# whatever family the table contains. See docs/OPEN_QUESTIONS.md.
seeds: [0, 1, 2, 3, 4]
