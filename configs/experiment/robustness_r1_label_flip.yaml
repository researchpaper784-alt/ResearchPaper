# Phase 8, R1 -- label-flipping attackers at 10%/20%/30% of clients (fl/app.py's
# is_attacker_client + local_train(label_flip=True), Phase 8). The dispersion term in
# F(alpha) (plan §4.5) should down-weight flipped clients automatically -- compared
# here against Krum / Trimmed-Mean / plain FedAvg, the standard robustness
# reference set (plan §8's own framing).
#
# Run: .venv/bin/python scripts/run_sweep.py --config configs/experiment/robustness_r1_label_flip.yaml

base_overrides:
  num-clients: 20
  min-client-size: 5
  fraction-train: 1.0
  min-train-nodes: 2
  min-evaluate-nodes: 2
  min-available-nodes: 2
  model-name: simple_cnn
  model-pretrained: false
  model-norm: groupnorm
  image-size: 112
  local-epochs: 2
  local-lr: 0.01
  local-batch-size: 32
  num-rounds: 100
  deterministic: true
  attack: label_flip
  regime: dirichlet
  alpha: 0.3

strategies:
  - name: fedavg
    file: configs/strategy/fedavg.yaml
  # Krum's own num-malicious-nodes is a fixed assumption (4 = 20% of 20 clients, the
  # middle test point below), not dynamically matched to each attack-fraction cell
  # -- a real, deliberate simplification: this grid's "partitions" axis carries the
  # attacker fraction, and a strategy-specific value that should co-vary with a
  # partition-specific one doesn't have a clean expression in a plain Cartesian
  # product. Krum is therefore mildly under/over-configured at the 10%/30% cells,
  # not misconfigured at 20%. Flag this in any table built from this sweep.
  - name: krum
    overrides: {strategy-name: krum, num-malicious-nodes: 4}
  - name: trimmed_mean
    file: configs/strategy/trimmed_mean.yaml
  - name: fedaco
    file: configs/strategy/fedaco.yaml

partitions:
  - name: attackers_10pct
    overrides: {attack-fraction: 0.10}
  - name: attackers_20pct
    overrides: {attack-fraction: 0.20}
  - name: attackers_30pct
    overrides: {attack-fraction: 0.30}

# 8 seeds, raised from 3. The signed-rank test's p-value floor is set by the pair
# count alone: at 3 seeds the smallest two-sided p it can return is 0.2500, so this
# sweep could not produce a significant result at alpha=0.05 under any data. 8 seeds moves
# the floor to 0.0078. See docs/OPEN_QUESTIONS.md, "5 seeds cannot produce a significant
# result", and `analysis.seeds_needed_for` for the family-size dependence.
seeds: [0, 1, 2, 3, 4, 5, 6, 7]
