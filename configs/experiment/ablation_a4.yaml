# Phase 7, A4 -- surrogate terms: drop gamma1 (alignment), gamma2 (dispersion), or
# gamma3 (entropy) individually from F(alpha) (aco/fitness.py::DataFreeFitness).
# Isolates which signal actually drives any gain -- turns a hand-designed objective
# into an evidence-backed one.
#
# Run: .venv/bin/python scripts/run_sweep.py --config configs/experiment/ablation_a4.yaml

base_overrides:
  num-clients: 20
  min-client-size: 5
  fraction-train: 1.0
  min-train-nodes: 2
  min-evaluate-nodes: 2
  min-available-nodes: 2
  model-name: simple_cnn
  model-pretrained: false
  model-norm: groupnorm
  image-size: 112
  local-epochs: 2
  local-lr: 0.01
  local-batch-size: 32
  num-rounds: 100
  deterministic: true
  strategy-name: fedaco

strategies:
  - name: full
    overrides: {aco-gamma-alignment: 1.0, aco-gamma-dispersion: 0.50, aco-gamma-entropy: 0.10}
  - name: no_alignment
    overrides: {aco-gamma-alignment: 0.0, aco-gamma-dispersion: 0.50, aco-gamma-entropy: 0.10}
  - name: no_dispersion
    overrides: {aco-gamma-alignment: 1.0, aco-gamma-dispersion: 0.0, aco-gamma-entropy: 0.10}
  - name: no_entropy
    overrides: {aco-gamma-alignment: 1.0, aco-gamma-dispersion: 0.50, aco-gamma-entropy: 0.0}

partitions:
  - name: iid
    file: configs/data/iid.yaml
  - name: dirichlet_0.3
    file: configs/data/dirichlet_0.3.yaml
  - name: quantity_skew
    file: configs/data/quantity_skew.yaml

# 8 seeds, raised from 3. The signed-rank test's p-value floor is set by the pair
# count alone: at 3 seeds the smallest two-sided p it can return is 0.2500, so this
# sweep could not produce a significant result at alpha=0.05 under any data. 8 seeds moves
# the floor to 0.0078. See docs/OPEN_QUESTIONS.md, "5 seeds cannot produce a significant
# result", and `analysis.seeds_needed_for` for the family-size dependence.
seeds: [0, 1, 2, 3, 4, 5, 6, 7]
