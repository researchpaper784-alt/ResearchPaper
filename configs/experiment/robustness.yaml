# Phase 8 -- robustness.
#
# Three of this project's baselines exist for exactly this sweep. Krum, FedTrimmedAvg and
# FedMedian are robust-aggregation rules; their entire justification is surviving
# Byzantine clients, and until `fl/attacks.py` existed there was no way to put one in
# front of them. Every number they have in the main table was earned against an entirely
# honest federation, where they have nothing to do but lose a little accuracy to their own
# trimming.
#
# FedACO has a stake too: its desirability heuristic scores clients on alignment with the
# robust consensus and on update magnitude against the median (`aco/heuristics.py`), both
# explicitly anomaly signals. `tests/test_strategy.py::test_planted_bad_client` already
# asserts that a negated, amplified update earns a weight below its FedAvg share -- which
# is `sign_flip` at unit scale. This sweep is where that becomes a claim about real runs.
#
# ⚠️ Read the attack axis carefully when quoting results. `sign_flip`, `scaled` and
# `gaussian` poison the *update* after honest training -- the threat model robust
# aggregation addresses. `label_flip` poisons the *data* before it, so the client sends a
# perfectly well-formed update computed from a lie, and aggregation-level defences have
# far less grip on it. A method that survives one says nothing about the other, and a
# robustness claim that does not name which was tested is not a claim.

name: robustness

# The full field, not just the robust-aggregation three: the interesting question is
# whether the rules built for this actually beat the ones that were not.
strategies:
  - fedavg
  - krum
  - trimmed-mean
  - median
  - fedaco

# Attacks are the axis under test, so heterogeneity is held at one representative setting
# rather than crossed with it -- crossing both would be 5 x 6 x 9 x 5 cells and would
# confound "robust to attack" with "robust to skew". dirichlet_0.3 is the mid point of the
# alphas characterized in Phase 1.4 (JS divergence 0.435).
regimes:
  - name: dirichlet_0.3
    regime: dirichlet
    alpha: 0.3

# 5 seeds, deliberately. These sweeps are read as *descriptions* -- which component
# carries the result, how performance degrades under attack -- and effect sizes and
# degradation curves carry that without a significance test. The 8-seed floor is
# reserved for the two places a p-value is actually claimed: main.yaml's headline
# comparison and ablation_a1's ACO-vs-random-search control. Raising these too costs
# ~640 cells and strengthens no claim in the paper.
#
# ⚠️ If a claim of the form "X significantly beats Y" ends up resting on this sweep,
# it needs 8 seeds like the others -- `make tables` prints the requirement for
# whatever family the table contains. See docs/OPEN_QUESTIONS.md.
seeds: [0, 1, 2, 3, 4]

variants:
  # ⚠️ Like ablation_all.yaml, this file is no longer the whole robustness story and must
  # not be run as if it were. R1-R5 live in configs/experiment/robustness_r*.yaml and are
  # driven by scripts/run_sweep_granular.py.
  #
  # Six variants were removed on 2026-09-19 because a granular config already covered the
  # same attack at the same fractions, matched by run-config key rather than by label:
  #
  #   removed from here      covered by
  #   label_flip_20          robustness_r1_label_flip.yaml  (fractions 0.1/0.2/0.3)
  #   sign_flip_10/30        robustness_r2_update_attack.yaml (sign_flip 0.1/0.2/0.3)
  #   gaussian_20            robustness_r2_update_attack.yaml (gaussian 0.1/0.2/0.3)
  #   participation_50/25    robustness_r3_stragglers.yaml  (fraction-train 0.1/0.3/0.5)
  #
  # The granular configs sweep *three* fractions where this file sampled one or two, so
  # nothing is lost by removing them -- the finer grid strictly contains the coarser one.
  #
  # `scaled` is the exception and is why this file still exists: no granular config covers
  # a magnitude-only attack. That matters specifically because it is the one attack an
  # alignment-based heuristic cannot see -- FedACO's a_k is a cosine and is blind to a
  # scaled update, so only the norm-ratio r_k can catch it. Dropping it would remove the
  # single case that separates the method's two heuristics.

  - name: clean

  - name: scaled_10
    attack: scaled
    attack-fraction: 0.1
    attack-scale: 10.0
    num-malicious-nodes: 2
  - name: scaled_30
    attack: scaled
    attack-fraction: 0.3
    attack-scale: 10.0
    num-malicious-nodes: 6

common:
  num-clients: 20
  num-rounds: 100
  local-epochs: 1
  local-lr: 0.01
  local-batch-size: 32
  model-name: simple_cnn
  model-norm: groupnorm
  image-size: 112
  output-dir: results/fl/robustness
