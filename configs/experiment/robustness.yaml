# Phase 8 -- robustness.
#
# Three of this project's baselines exist for exactly this sweep. Krum, FedTrimmedAvg and
# FedMedian are robust-aggregation rules; their entire justification is surviving
# Byzantine clients, and until `fl/attacks.py` existed there was no way to put one in
# front of them. Every number they have in the main table was earned against an entirely
# honest federation, where they have nothing to do but lose a little accuracy to their own
# trimming.
#
# FedACO has a stake too: its desirability heuristic scores clients on alignment with the
# robust consensus and on update magnitude against the median (`aco/heuristics.py`), both
# explicitly anomaly signals. `tests/test_strategy.py::test_planted_bad_client` already
# asserts that a negated, amplified update earns a weight below its FedAvg share -- which
# is `sign_flip` at unit scale. This sweep is where that becomes a claim about real runs.
#
# ⚠️ Read the attack axis carefully when quoting results. `sign_flip`, `scaled` and
# `gaussian` poison the *update* after honest training -- the threat model robust
# aggregation addresses. `label_flip` poisons the *data* before it, so the client sends a
# perfectly well-formed update computed from a lie, and aggregation-level defences have
# far less grip on it. A method that survives one says nothing about the other, and a
# robustness claim that does not name which was tested is not a claim.

name: robustness

# The full field, not just the robust-aggregation three: the interesting question is
# whether the rules built for this actually beat the ones that were not.
strategies:
  - fedavg
  - krum
  - trimmed-mean
  - median
  - fedaco

# Attacks are the axis under test, so heterogeneity is held at one representative setting
# rather than crossed with it -- crossing both would be 5 x 6 x 9 x 5 cells and would
# confound "robust to attack" with "robust to skew". dirichlet_0.3 is the mid point of the
# alphas characterized in Phase 1.4 (JS divergence 0.435).
regimes:
  - name: dirichlet_0.3
    regime: dirichlet
    alpha: 0.3

# 8 seeds, raised from 5. The signed-rank test's p-value floor is set by the pair
# count alone: at 5 seeds the smallest two-sided p it can return is 0.0625, so this
# sweep could not produce a significant result at alpha=0.05 under any data. 8 seeds moves
# the floor to 0.0078. See docs/OPEN_QUESTIONS.md, "5 seeds cannot produce a significant
# result", and `analysis.seeds_needed_for` for the family-size dependence.
seeds: [0, 1, 2, 3, 4, 5, 6, 7]

variants:
  # The control: same strategies, same regime, no adversary. Without it in the same sweep
  # there is no honest baseline to measure degradation against, and differencing against
  # the main table would fold in every difference between the two sweeps' settings.
  - name: clean

  # --- update poisoning, increasing share of the federation ----------------------
  # 10% and 30% bracket the usual reporting points. 30% is above the classic Byzantine
  # tolerance of most robust rules, so it is where they are expected to break -- included
  # deliberately, because a robustness sweep that only tests where defences hold measures
  # nothing.
  # `num-malicious-nodes` is Krum's own f -- how many Byzantine clients it assumes. It
  # defaults to 0, and Krum's guarantee simply does not hold at f=0 when adversaries are
  # present: it scores each candidate against all n-2 neighbours instead of n-f-2. Left
  # unset, "Krum broke at 30%" would be a statement about a misconfigured Krum. Set to
  # match each variant's real attacker count at K=20 (ceil(f*K)). It is ignored by every
  # other strategy.
  - name: sign_flip_10
    attack: sign_flip
    attack-fraction: 0.1
    attack-scale: 2.0
    num-malicious-nodes: 2
  - name: sign_flip_30
    attack: sign_flip
    attack-fraction: 0.3
    attack-scale: 2.0
    num-malicious-nodes: 6

  # Magnitude-only. Alignment-based detection cannot see this one at all -- the direction
  # is correct, only the size is wrong -- so it separates FedACO's two heuristic terms.
  - name: scaled_10
    attack: scaled
    attack-fraction: 0.1
    attack-scale: 10.0
    num-malicious-nodes: 2
  - name: scaled_30
    attack: scaled
    attack-fraction: 0.3
    attack-scale: 10.0
    num-malicious-nodes: 6

  - name: gaussian_20
    attack: gaussian
    attack-fraction: 0.2
    attack-scale: 3.0
    num-malicious-nodes: 4

  # --- data poisoning ------------------------------------------------------------
  # The well-formed-update case. Expect robust aggregation to help much less here; if it
  # appears to help just as much, that is a result worth checking rather than celebrating.
  - name: label_flip_20
    attack: label_flip
    attack-fraction: 0.2
    num-malicious-nodes: 4

  # --- partial participation -----------------------------------------------------
  # Not an attack: clients dropping out is ordinary FL, and `fraction-train` already
  # existed. Included because "robustness" in the plan covers it and because FedACO's
  # cross-round pheromone is keyed by client id -- a client absent for several rounds has
  # its row decayed toward tau0 (`aco/pheromone.py::begin_round`), which is a behaviour
  # nothing has ever exercised at scale.
  - name: participation_50
    fraction-train: 0.5
  - name: participation_25
    fraction-train: 0.25

common:
  num-clients: 20
  num-rounds: 100
  local-epochs: 1
  local-lr: 0.01
  local-batch-size: 32
  model-name: simple_cnn
  model-norm: groupnorm
  image-size: 112
  output-dir: results/fl/robustness
