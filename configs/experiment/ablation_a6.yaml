# Phase 7, A6 -- hyperparameter sensitivity: a, b, rho, q0, A (n_ants), I
# (n_iterations), L (num_levels), one-at-a-time around configs/strategy/fedaco.yaml's
# default (matching plan §14), each swept at {below, default, above}. Metaheuristic
# papers get rejected for knife-edge sensitivity -- report this as a heatmap/table;
# flatter is better. Every entry here changes exactly one hyperparameter from the
# fedaco.yaml default; all others stay at that default.
#
# The several "..._default" entries below are, by construction, identical configs
# to each other (every hyperparameter at its default) -- run_sweep.py's run_id-based
# resume-skip means only the first one actually executes; the rest register as
# already-completed. Intentional, not wasted compute: it's what lets each axis be
# read as its own clean {below, default, above} triple in the resulting table.
#
# Run: .venv/bin/python scripts/run_sweep_granular.py --config configs/experiment/ablation_a6.yaml

base_overrides:
  num-clients: 20
  min-client-size: 5
  fraction-train: 1.0
  min-train-nodes: 2
  min-evaluate-nodes: 2
  min-available-nodes: 2
  model-name: simple_cnn
  model-pretrained: false
  model-norm: groupnorm
  image-size: 112
  local-epochs: 2
  local-lr: 0.01
  local-batch-size: 32
  num-rounds: 100
  deterministic: true
  strategy-name: fedaco

strategies:
  # The level grid's *shape*, not just its size. docs/IMPLEMENTATION_PLAN.md §14
  # specifies the linear set; the codebase shipped log-spaced until 2026-09-19, which
  # allows alpha ratios of 1143:1 against linear's 10:1 and therefore makes the
  # degenerate single-client optimum far easier for an ant to construct
  # (`fitness.corner_margin`). "linear" is now the default; this cell measures what the
  # old behaviour was worth rather than assuming the switch was free.
  - name: levels_log_spaced
    overrides: {aco-level-spacing: log}
  # gamma_3, the concentration penalty weight -- added 2026-09-19, and the most
  # consequential entry in this file. It is the only term standing against the degenerate
  # single-client optimum: at a vertex the dispersion term is exactly zero, so the corner's
  # score is `gamma_1*cos(delta_j, robust_mean) - gamma_3*log K` and gamma_3 alone decides
  # whether "discard every client but one" outscores the FedAvg point. A6 swept seven
  # hyperparameters and not this one, while the first real GPU run showed the default 0.1
  # loses the corner in 15 of 15 rounds at K=10 (`required_gamma_entropy` >= 0.45 there).
  #
  # The default is deliberately NOT changed. Raising it repairs the corner but charges *any*
  # concentration, including the genuine down-weighting of a straggler or an adversary that
  # R1-R3 need FedACO to perform -- so the value is a measured trade-off, not a bug fix, and
  # these three cells are what measures it. 0.5 brackets the K=10 requirement with headroom;
  # 1.0 is deliberately past the point where the penalty should start costing accuracy, so
  # the sweep shows the cost rather than only the fix.
  - name: gamma_entropy=0.1_default
    overrides: {aco-gamma-entropy: 0.1}
  - name: gamma_entropy=0.5
    overrides: {aco-gamma-entropy: 0.5}
  - name: gamma_entropy=1.0
    overrides: {aco-gamma-entropy: 1.0}
  # What the dispersion term measures spread ABOUT -- added 2026-09-20, and arguably the most
  # important single cell in the whole ablation suite. A weighted variance about Delta(alpha)
  # is exactly ZERO at every vertex, which is why the corner wins at any sane gamma_3 and why
  # the gamma_3 needed to close it (0.481 measured, see the cells above) drags the whole
  # landscape negative: the first attempt at that left 7 of 15 rounds unable to deposit and
  # FedACO 0.21 macro-F1 behind FedAvg. Measured about the FedAvg point instead, a vertex
  # costs ||delta_j - Delta_base||^2 and the degeneracy disappears at the DEFAULT gamma_3.
  #
  # If this cell wins, it is not a hyperparameter result -- it is a correction to §4.5's
  # fitness, and the paper has to say so.
  - name: dispersion_about_fedavg_point
    overrides: {aco-dispersion-reference: base}
  # The one that actually works. "base" is exactly linear in alpha, so it has no interior
  # optimum and a vertex on the nearest client is cheaper than any mix -- on real deltas it
  # moved the corner margin from +0.6184 to +0.3136 and stopped. "aggregate" measures
  # ||Delta(alpha) - Delta_rob||^2 instead: quadratic, minimized in the interior because
  # averaging cancels per-client noise. Across K in {10,20} x noise in {1.5,3,6} x
  # {uniform, dirichlet-skewed} base weights it is the only shape that both rules out the
  # corner AND keeps F at the FedAvg point positive, at the default gamma_entropy.
  # Kept alongside "base" rather than replacing it: the paper has to show why the obvious
  # fixed-reference fix is not the one, and that needs the cell.
  - name: dispersion_aggregate_drift
    overrides: {aco-dispersion-reference: aggregate}
  - name: a=0.5
    overrides: {aco-pheromone-exp: 0.5}
  - name: a=1.0_default
    overrides: {aco-pheromone-exp: 1.0}
  - name: a=2.0
    overrides: {aco-pheromone-exp: 2.0}
  - name: b=1.0
    overrides: {aco-heuristic-exp: 1.0}
  - name: b=2.0_default
    overrides: {aco-heuristic-exp: 2.0}
  - name: b=4.0
    overrides: {aco-heuristic-exp: 4.0}
  - name: rho=0.05
    overrides: {aco-rho: 0.05}
  - name: rho=0.10_default
    overrides: {aco-rho: 0.10}
  - name: rho=0.30
    overrides: {aco-rho: 0.30}
  - name: q0=0.5
    overrides: {aco-q0: 0.5}
  - name: q0=0.7_default
    overrides: {aco-q0: 0.7}
  - name: q0=0.9
    overrides: {aco-q0: 0.9}
  - name: ants=15
    overrides: {aco-ants-start: 15, aco-ants-end: 5}
  - name: ants=30_default
    overrides: {aco-ants-start: 30, aco-ants-end: 10}
  - name: ants=60
    overrides: {aco-ants-start: 60, aco-ants-end: 20}
  - name: iters=5
    overrides: {aco-iters-start: 5, aco-iters-end: 2}
  - name: iters=10_default
    overrides: {aco-iters-start: 10, aco-iters-end: 4}
  - name: iters=20
    overrides: {aco-iters-start: 20, aco-iters-end: 8}
  - name: levels=7
    overrides: {aco-num-levels: 7}
  - name: levels=11_default
    overrides: {aco-num-levels: 11}
  - name: levels=15
    overrides: {aco-num-levels: 15}

partitions:
  - name: iid
    file: configs/data/iid.yaml
  - name: dirichlet_0.3
    file: configs/data/dirichlet_0.3.yaml

# 5 seeds, deliberately. These sweeps are read as *descriptions* -- which component
# carries the result, how performance degrades under attack -- and effect sizes and
# degradation curves carry that without a significance test. The 8-seed floor is
# reserved for the two places a p-value is actually claimed: main.yaml's headline
# comparison and ablation_a1's ACO-vs-random-search control. Raising these too costs
# ~640 cells and strengthens no claim in the paper.
#
# ⚠️ If a claim of the form "X significantly beats Y" ends up resting on this sweep,
# it needs 8 seeds like the others -- `make tables` prints the requirement for
# whatever family the table contains. See docs/OPEN_QUESTIONS.md.
seeds: [0, 1, 2, 3, 4]
