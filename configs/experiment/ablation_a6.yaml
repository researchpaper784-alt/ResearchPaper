# Phase 7, A6 -- hyperparameter sensitivity: a, b, rho, q0, A (n_ants), I
# (n_iterations), L (num_levels), one-at-a-time around configs/strategy/fedaco.yaml's
# default (matching plan §14), each swept at {below, default, above}. Metaheuristic
# papers get rejected for knife-edge sensitivity -- report this as a heatmap/table;
# flatter is better. Every entry here changes exactly one hyperparameter from the
# fedaco.yaml default; all others stay at that default.
#
# The several "..._default" entries below are, by construction, identical configs
# to each other (every hyperparameter at its default) -- run_sweep.py's run_id-based
# resume-skip means only the first one actually executes; the rest register as
# already-completed. Intentional, not wasted compute: it's what lets each axis be
# read as its own clean {below, default, above} triple in the resulting table.
#
# Run: .venv/bin/python scripts/run_sweep.py --config configs/experiment/ablation_a6.yaml

base_overrides:
  num-clients: 20
  min-client-size: 5
  fraction-train: 1.0
  min-train-nodes: 2
  min-evaluate-nodes: 2
  min-available-nodes: 2
  model-name: simple_cnn
  model-pretrained: false
  model-norm: groupnorm
  image-size: 112
  local-epochs: 2
  local-lr: 0.01
  local-batch-size: 32
  num-rounds: 100
  deterministic: true
  strategy-name: fedaco

strategies:
  - name: a=0.5
    overrides: {fedaco-a-exponent: 0.5}
  - name: a=1.0_default
    overrides: {fedaco-a-exponent: 1.0}
  - name: a=2.0
    overrides: {fedaco-a-exponent: 2.0}
  - name: b=1.0
    overrides: {fedaco-b-exponent: 1.0}
  - name: b=2.0_default
    overrides: {fedaco-b-exponent: 2.0}
  - name: b=4.0
    overrides: {fedaco-b-exponent: 4.0}
  - name: rho=0.05
    overrides: {fedaco-rho: 0.05}
  - name: rho=0.10_default
    overrides: {fedaco-rho: 0.10}
  - name: rho=0.30
    overrides: {fedaco-rho: 0.30}
  - name: q0=0.5
    overrides: {fedaco-q0: 0.5}
  - name: q0=0.7_default
    overrides: {fedaco-q0: 0.7}
  - name: q0=0.9
    overrides: {fedaco-q0: 0.9}
  - name: ants=15
    overrides: {fedaco-ants-start: 15, fedaco-ants-end: 5}
  - name: ants=30_default
    overrides: {fedaco-ants-start: 30, fedaco-ants-end: 10}
  - name: ants=60
    overrides: {fedaco-ants-start: 60, fedaco-ants-end: 20}
  - name: iters=5
    overrides: {fedaco-iters-start: 5, fedaco-iters-end: 2}
  - name: iters=10_default
    overrides: {fedaco-iters-start: 10, fedaco-iters-end: 4}
  - name: iters=20
    overrides: {fedaco-iters-start: 20, fedaco-iters-end: 8}
  - name: levels=7
    overrides: {fedaco-num-levels: 7}
  - name: levels=11_default
    overrides: {fedaco-num-levels: 11}
  - name: levels=15
    overrides: {fedaco-num-levels: 15}

partitions:
  - name: iid
    file: configs/data/iid.yaml
  - name: dirichlet_0.3
    file: configs/data/dirichlet_0.3.yaml

seeds: [0, 1, 2]
