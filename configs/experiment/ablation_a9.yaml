# Phase 7, A9 -- normalization confound control: BatchNorm vs. GroupNorm. Shows
# whether any FedACO gain is real aggregation behavior, not a BatchNorm artifact
# (BatchNorm's running stats aggregate badly under non-IID federated data -- a known
# FL pathology, unrelated to weight-selection method). Both FedACO and plain FedAvg
# are included so the *interaction* (does the norm choice affect FedACO differently
# than FedAvg?) is visible, not just each method's own norm sensitivity in isolation.
#
# Run: .venv/bin/python scripts/run_sweep_granular.py --config configs/experiment/ablation_a9.yaml

base_overrides:
  num-clients: 20
  min-client-size: 5
  fraction-train: 1.0
  min-train-nodes: 2
  min-evaluate-nodes: 2
  min-available-nodes: 2
  model-name: simple_cnn
  model-pretrained: false
  image-size: 112
  local-epochs: 2
  local-lr: 0.01
  local-batch-size: 32
  num-rounds: 100
  deterministic: true

strategies:
  - name: fedavg_groupnorm
    overrides: {strategy-name: fedavg, model-norm: groupnorm}
  - name: fedavg_batchnorm
    overrides: {strategy-name: fedavg, model-norm: batchnorm}
  - name: fedaco_groupnorm
    overrides: {strategy-name: fedaco, model-norm: groupnorm}
  - name: fedaco_batchnorm
    overrides: {strategy-name: fedaco, model-norm: batchnorm}

partitions:
  - name: iid
    file: configs/data/iid.yaml
  - name: dirichlet_0.3
    file: configs/data/dirichlet_0.3.yaml

# 5 seeds, deliberately. These sweeps are read as *descriptions* -- which component
# carries the result, how performance degrades under attack -- and effect sizes and
# degradation curves carry that without a significance test. The 8-seed floor is
# reserved for the two places a p-value is actually claimed: main.yaml's headline
# comparison and ablation_a1's ACO-vs-random-search control. Raising these too costs
# ~640 cells and strengthens no claim in the paper.
#
# ⚠️ If a claim of the form "X significantly beats Y" ends up resting on this sweep,
# it needs 8 seeds like the others -- `make tables` prints the requirement for
# whatever family the table contains. See docs/OPEN_QUESTIONS.md.
seeds: [0, 1, 2, 3, 4]
