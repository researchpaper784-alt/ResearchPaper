# Phase 7 -- FedACO ablations.
#
# Each `variant` below is FedACO with one thing changed, run against the same regimes and
# seeds as the main table so the comparison is like-for-like. `default` is included as the
# control: without it in the same sweep there is nothing to difference the ablations
# against, since numbers from a different sweep may differ for unrelated reasons.
#
# ⚠️ **This is not the plan's full A1-A9 list.** The implementation plan is not in this
# repository (docs/PROGRESS_REVIEW.md records that as an open issue), so the only
# ablations that can be reconstructed are the ones the repo itself names -- A1, A3 and A9
# -- plus the knobs docs/OPEN_QUESTIONS.md explicitly defers to Phase 7. A2 and A4-A8 are
# *not* guessed at here: inventing an ablation and labelling it with the plan's number
# would be worse than the gap. Add them when the plan is available.

name: ablation_all

strategies: [fedaco]

# The regimes where an aggregation-weighting ablation can actually show something.
# `iid` is kept as the null case: under IID there is little heterogeneity to exploit, so
# an ablation that moves the number *there* is evidence the mechanism is doing something
# other than handling heterogeneity.
regimes:
  - name: iid
    regime: iid
  - name: dirichlet_0.1
    regime: dirichlet
    alpha: 0.1
  # quantity_skew attacks FedAvg's n_k weighting directly, which is what FedSwarm
  # replaces -- the regime where these ablations should bite hardest.
  - name: quantity_skew
    regime: quantity_skew
    skew-sigma: 1.0

# 5 seeds, deliberately. These sweeps are read as *descriptions* -- which component
# carries the result, how performance degrades under attack -- and effect sizes and
# degradation curves carry that without a significance test. The 8-seed floor is
# reserved for the two places a p-value is actually claimed: main.yaml's headline
# comparison and ablation_a1's ACO-vs-random-search control. Raising these too costs
# ~640 cells and strengthens no claim in the paper.
#
# ⚠️ If a claim of the form "X significantly beats Y" ends up resting on this sweep,
# it needs 8 seeds like the others -- `make tables` prints the requirement for
# whatever family the table contains. See docs/OPEN_QUESTIONS.md.
seeds: [0, 1, 2, 3, 4]

variants:
  # ⚠️ This file is NOT "all the ablations", despite its name, and must not be run as if
  # it were. A1-A9 live in configs/experiment/ablation_a[1-9].yaml and are driven by
  # scripts/run_sweep_granular.py. What remains here is only what that family does not
  # cover.
  #
  # Five variants were removed on 2026-09-19 because a granular config already varied the
  # same run-config key, matched by key rather than by label:
  #
  #   removed from here        key varied                 covered by
  #   a1_persistence_none/full aco-persistence            ablation_a2.yaml
  #   a3_fitness_server_val    aco-fitness-mode           ablation_a3.yaml
  #   a9_batchnorm             model-norm                 ablation_a9.yaml
  #   shrinkage_0.8/1.2        aco-target-sum             ablation_a7.yaml
  #   gamma_dispersion_0.5/2.0 aco-gamma-dispersion       ablation_a4.yaml
  #
  # Those cost ~176 duplicated cells, but the compute was the smaller problem. **The
  # labels collided**: this file called persistence "A1" while ablation_a1.yaml is the
  # ACO-vs-random-search control, and both wrote to results/fl/ablation. "A1" in a
  # results table meant two different experiments depending on which runner produced it.
  # Nothing downstream could have distinguished them.

  # The control. Everything below is differenced against this.
  - name: default

  # --- The safety fallback -------------------------------------------------------
  # With the fallback off, FedACO can lose to FedAvg outright. That is the point: the
  # default configuration silently *becomes* FedAvg whenever the colony loses, so the
  # main table cannot separate "the colony helped" from "the fallback protected it".
  # Not in the plan's A-list and not covered by any granular config.
  - name: no_safety_fallback
    aco-safety-fallback: false

  # --- The concentration penalty's shape -----------------------------------------
  # Dispersion is a weighted variance, so it is exactly zero at a single-client vertex:
  # the fitness pays nothing for discarding every client but one, and the only guard is
  # `gamma_3 * P_max(K)` -- log K under the proposed "entropy" penalty, 1 - 1/K under
  # "gini". The gamma_3 needed to rule out the degenerate vertex varies 2.7-4.4x across
  # K under "entropy" and 1.01-1.53x under "gini" (docs/EXPERIMENT_LOG.md, 2026-09-18).
  #
  # `penalty_entropy_strong` runs the *proposed* shape at the same gamma_3, so a win for
  # gini cannot be confounded with "gamma_3 was simply too small". Read both next to
  # `corner_margin`, which is logged per round.
  - name: penalty_gini
    aco-concentration-penalty: gini
    aco-gamma-entropy: 0.25
  - name: penalty_entropy_strong
    aco-gamma-entropy: 0.25

common:
  num-clients: 20
  num-rounds: 100
  local-epochs: 1
  local-lr: 0.01
  local-batch-size: 32
  model-name: simple_cnn
  model-norm: groupnorm
  image-size: 112
  output-dir: results/fl/ablation
