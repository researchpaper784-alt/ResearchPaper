# Phase 7, A2 -- pheromone persistence: none / decayed / full (aco/pheromone.py's
# three real modes). Isolates whether cross-round stigmergy actually helps -- the
# paper's conceptual hook (plan §4.3): if "decayed"/"full" don't beat "none" here,
# the "Adaptive" in FedACO/FedSwarm is decorative, and the paper needs to say so.
#
# Run: .venv/bin/python scripts/run_sweep.py --config configs/experiment/ablation_a2.yaml

base_overrides:
  num-clients: 20
  min-client-size: 5
  fraction-train: 1.0
  min-train-nodes: 2
  min-evaluate-nodes: 2
  min-available-nodes: 2
  model-name: simple_cnn
  model-pretrained: false
  model-norm: groupnorm
  image-size: 112
  local-epochs: 2
  local-lr: 0.01
  local-batch-size: 32
  num-rounds: 100
  deterministic: true
  strategy-name: fedaco

strategies:
  - name: none
    overrides: {aco-persistence: none}
  - name: decayed
    overrides: {aco-persistence: decayed}
  - name: full
    overrides: {aco-persistence: full}

partitions:
  - name: iid
    file: configs/data/iid.yaml
  - name: dirichlet_0.1
    file: configs/data/dirichlet_0.1.yaml
  - name: dirichlet_0.3
    file: configs/data/dirichlet_0.3.yaml
  - name: quantity_skew
    file: configs/data/quantity_skew.yaml

seeds: [0, 1, 2]
