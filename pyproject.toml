[project]
name = "fedswarm"
version = "0.0.1"
description = "FedSwarm: Adaptive Aggregation Optimization in Federated Learning using Swarm Intelligence for Brain Tumor Diagnosis"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { file = "LICENSE" }  # fab-format-version=1 (Phase 3's [tool.flwr.app]) requires a root-level license file, not inline text -- caught by `flwr build`, not assumed
dependencies = [
  # fab-format-version=1 (Phase 3's [tool.flwr.app]) rejects an exact "==" pin here --
  # requires an inclusive ">=" lower bound (caught by `flwr build`, not assumed). This
  # range still resolves to exactly 1.36.0 today; re-check before 1.37.0 is adopted.
  "flwr>=1.36.0,<1.37.0",
  "flwr-datasets[vision]>=0.5.0",
  # torch/torchvision/numpy are platform-split, not just pinned -- and this is now a
  # hard *correctness* requirement, not a style choice. `flwr run` creates its own
  # isolated per-run environment via `uv sync` against exactly this dependency list
  # (confirmed: a real Colab run failed here, 2026-09-16 -- "torch==2.2.2 ... doesn't
  # have a source distribution or wheel for the current platform", cp313). A single
  # `torch==2.2.2` pin -- chosen only because this dev machine is Intel macOS, which
  # has no newer wheel at all (docs/FLOWER_API_NOTES.md) -- was silently shipping that
  # constraint into every environment the app ever runs in, including Colab/Kaggle,
  # which need a modern torch and have no reason to be limited by this machine's
  # wheel gap. Two entries per package, split by a mutually exclusive marker, is the
  # standard PEP 508 pattern for exactly this ("no unary `not` in marker grammar" --
  # `!=`/`or` express the negation instead).
  "torch==2.2.2 ; platform_system == 'Darwin' and platform_machine == 'x86_64'",
  "torch>=2.5.0 ; platform_system != 'Darwin' or platform_machine != 'x86_64'",
  "torchvision==0.17.2 ; platform_system == 'Darwin' and platform_machine == 'x86_64'",
  "torchvision>=0.20.0 ; platform_system != 'Darwin' or platform_machine != 'x86_64'",
  # numpy<2 is specifically required by torch==2.2.2's ABI (docs/FLOWER_API_NOTES.md) --
  # only the Intel-macOS branch above uses that torch, so only it needs the cap.
  "numpy>=1.26,<2 ; platform_system == 'Darwin' and platform_machine == 'x86_64'",
  "numpy>=1.26 ; platform_system != 'Darwin' or platform_machine != 'x86_64'",
  # Everything below was pinned for plain reproducibility, not a discovered wheel gap
  # -- loosened to a lower bound only (2026-09-16, alongside the torch fix above) so
  # the same list also resolves cleanly under `uv sync` on Colab's Python 3.13, which
  # this repo has never been able to test an exact pin against locally (this dev
  # machine is Python 3.12). Whatever actually resolves is still captured per-run by
  # utils/provenance.py, which is what "no silent fabrication" actually depends on --
  # not the exactness of the spec in this file.
  "scipy>=1.14.1",
  "scikit-learn>=1.5.2",
  "pandas>=2.2.3",
  "pyyaml>=6.0.2",
  "omegaconf>=2.3.0",
  "matplotlib>=3.9.2",
  "seaborn>=0.13.2",
  "tqdm>=4.67.1",
  "rich>=14.0.0,<15.0.0",
  "pillow>=11.0.0",
  "imagehash>=4.3.1",
  "kaggle>=2.2.4",  # 1.x only supports the legacy kaggle.json auth; 2.x adds the newer bearer-token auth (KAGGLE_API_TOKEN / ~/.kaggle/access_token)
  "h5py>=3.16.0",  # decodes Figshare's MATLAB v7.3 (.mat) files -- see data/source_provenance.py
]

[project.optional-dependencies]
dev = [
  "pytest==8.3.4",
  "ruff==0.8.4",
  "mypy==1.13.0",
]
# `flwr[simulation]` pulls in `ray`, which ships no wheel for Intel macOS
# (verified 2026-09-14: `ray==2.55.1` has manylinux + macOS-arm64 + win wheels
# only). Install this extra in the actual training environment (Colab/Kaggle,
# both Linux) with: uv pip install -e ".[simulation]"
simulation = [
  "flwr[simulation]==1.36.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fedswarm"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]

# Phase 3 -- the Flower Message API app config `flwr run` reads. Schema confirmed
# against a freshly re-downloaded `@flwrlabs/quickstart-pytorch` (2026-09-16, same
# flwr==1.36.0 install) rather than assumed: `[tool.flwr.app]`/`.components`/`.config`
# is exactly what that reference app's own generated pyproject.toml uses, and its
# README confirms a bare `flwr run . --stream` picks the default (local, CPU-only unless
# GPU-visible) federation with no `[tool.flwr.federations]` section required.
#
# ⚠️ Only the schema is verified locally -- `flwr build`/`flwr run` themselves need the
# `simulation` extra (`ray`, no Intel-macOS wheel; see the platform-blocker note in
# docs/FLOWER_API_NOTES.md), so the values below have never actually been run through
# the Flower runtime on this machine. `num-clients`/`num-rounds` are set to a genuine
# 2-client/2-round smoke size, matching the plan's Step 3.1 acceptance criterion --
# the first real `flwr run .` on Colab is what actually confirms this config end-to-end,
# not this comment.
[tool.flwr.app]
publisher = "fedswarm"
fab-format-version = 1
flwr-version-target = "1.36.0"

[tool.flwr.app.components]
serverapp = "fedswarm.fl.app:server_app"
clientapp = "fedswarm.fl.app:client_app"

[tool.flwr.app.config]
# Partitioning (fedswarm.data.partition.PartitionSpec, flattened -- Context.run_config
# is dict[str, bool|float|int|str] only, verified, no nested structures allowed).
regime = "iid"
num-clients = 2
min-client-size = 5
partition-seed = 0
local-val-fraction = 0.1
partition-cache-dir = "data/processed/partitions"
# alpha / classes-per-client / skew-sigma are regime-specific: `regime="iid"` reads none
# of them, and `partition_spec_from_run_config` only reads the one its regime calls for.
#
# They were previously left undeclared here, with a comment saying to "override
# alongside `regime` together, e.g. --run-config "regime='dirichlet' alpha=0.3"". That
# never worked: `flwr run` rejects undeclared keys outright ([code: 15]), so every
# non-IID federated run -- i.e. the entire point of the project -- was unreachable from
# the CLI (verified 2026-09-17). Declared below so they can be overridden at all.
#
# PartitionSpec's own defaults are None (each regime requires its parameter explicitly),
# so these are not those; the values are the ones this project actually characterized in
# Phase 1.4 -- see scripts/make_partition_figures.py::REGIMES and the measured
# heterogeneity table in docs/EXPERIMENT_LOG.md. The full sweep varies alpha over
# {0.1, 0.3, 0.5, 1.0}; 0.3 is its mid point and partition.py's own CLI example.
# Each is read only when `regime` selects it.
alpha = 0.3
classes-per-client = 2
skew-sigma = 1.0

# Data.
image-size = 112
normalization = "dataset"
cache-dir = "data/processed/cache"
manifest-path = "data/processed/manifest.csv"

# Model.
model-name = "simple_cnn"
model-pretrained = false
model-norm = "groupnorm"
num-classes = 4

# Local training (fl/app.py's local_train).
local-epochs = 1
local-lr = 0.01
local-batch-size = 32
mu = 0.0  # static FedProx fallback; the real installed FedProx strategy overrides this via its own "proximal-mu" config key each round (see train_handler).

# Strategy selection (Phase 5, strategies/factory.py::strategy_from_run_config).
# One of: fedavg, fedprox, fedadam, fedyogi, krum, trimmed-mean, median, fednova,
# loss-based, scaffold, fedlaw, fedaco. Strategy-specific knobs (fedprox-mu,
# fedopt-eta/-eta-l/-beta1/-beta2/-tau, num-malicious-nodes, trim-beta,
# lossweight-temperature, scaffold-server-lr, fedlaw-steps/-lr) are declared below at
# their factory defaults.
#
# ⚠️ They used to be omitted here, with a comment saying they "only need overriding via
# --run-config when actually sweeping them". That was wrong for the same reason the
# partition keys above were: `flwr run` rejects undeclared keys with a bare "[code: 15]",
# so *none* of them could be swept -- which would have failed every trial of Phase 5's
# per-baseline hyperparameter search, the one thing they exist for. Found 2026-09-17 by
# tests/test_phase5_search.py::test_every_grid_key_is_declared_in_pyproject, which now
# checks this table against the search grids so the two cannot drift apart again.
strategy-name = "fedavg"
fedprox-mu = 0.01
# Per-strategy rather than a shared `fedopt-eta`: FedAdam and FedYogi have different
# published defaults, and one declared key would give both the same value. See
# strategies/factory.py.
fedadam-eta = 0.1
fedadam-eta-l = 0.1
fedyogi-eta = 0.01
fedyogi-eta-l = 0.0316
fedopt-beta1 = 0.9
fedopt-beta2 = 0.99
fedopt-tau = 0.001
num-malicious-nodes = 0
trim-beta = 0.2
lossweight-temperature = 1.0
scaffold-server-lr = 1.0
fedlaw-steps = 20
fedlaw-lr = 0.1

# FedACO knobs (Phase 4, strategies/factory.py::_build_fedaco). Every one is declared
# here at its dataclass default and only needs a --run-config override when swept.
#
# ⚠️ They have to be *declared*, not just documented in a comment: `flwr run
# --run-config` rejects any key absent from this table with a bare "[code: 15] Invalid
# run configuration", naming nothing. Verified by running it, 2026-09-17. Anything
# Phases 6-7 want to sweep must therefore appear below.
#
# The colony's RNG is seeded from the run-level `seed` further down, not set separately.
aco-num-levels = 11
aco-level-low = 0.0
aco-level-high = 2.5
# The global shrinkage s. SWEPT as fixed values, never searched per-round -- the
# deliberate Phase 4 scope reduction recorded in docs/OPEN_QUESTIONS.md.
aco-target-sum = 1.0
aco-ants-start = 30
aco-ants-end = 10
aco-iters-start = 10
aco-iters-end = 4
# ACS transition rule and within-round pheromone update (aco/colony.py).
aco-q0 = 0.9
aco-pheromone-exp = 1.0
aco-heuristic-exp = 2.0
aco-rho = 0.1
aco-q-deposit = 1.0
aco-tau-min = 0.01
aco-tau-max = 10.0
aco-global-best-every = 5
aco-stagnation-patience = 5
# Cross-round pheromone persistence (aco/pheromone.py). `aco-persistence` is the Phase 7
# A1 ablation: "none" | "full" | "decayed". Note aco-tau-min/aco-tau-max above are
# shared by the colony and the pheromone store, which use the same bounds by design.
aco-persistence = "decayed"
aco-tau0 = 1.0
aco-rho-round = 0.1
aco-absence-decay = 0.5
# Data-free fitness (aco/fitness.py). `aco-normalize-dispersion=false` restores the
# pre-2026-09-17 unnormalized dispersion term; there is no experimental reason to set
# it, see docs/EXPERIMENT_LOG.md. `aco-fitness-mode` is "data_free" (the method as
# proposed) or "server_val" (upper-bound reference, needs a much smaller colony budget);
# "client_probe" is not selectable -- its round-trip is Phase 7 work.
aco-gamma-alignment = 1.0
aco-gamma-dispersion = 1.0
aco-gamma-entropy = 0.1
aco-normalize-dispersion = true
aco-fitness-mode = "data_free"
# The concentration penalty's shape: "entropy" (log K - H(alpha), the method as proposed)
# or "gini" (sum_k p_k^2 - 1/K). Only the vertex value differs in practice -- log K vs
# 1 - 1/K -- and that is what decides whether one `aco-gamma-entropy` can hold across K.
# See docs/OPEN_QUESTIONS.md, "Residual 3".
aco-concentration-penalty = "entropy"
# Heuristic desirability weights (aco/heuristics.py).
aco-beta-alignment = 2.0
aco-beta-drift = 1.0
aco-beta-val-improvement = 1.0
aco-beta-data-size = 0.5
aco-trim-fraction = 0.2
aco-safety-fallback = true

# FedAvg-family node sampling (flwr.serverapp.strategy.FedAvg and every baseline
# above, all of which share this constructor shape -- strategies/factory.py).
fraction-train = 1.0
min-train-nodes = 2
min-evaluate-nodes = 2
min-available-nodes = 2

# Phase 8 -- adversarial clients (fl/attacks.py). `attack="none"` leaves every code path
# untouched, so a non-robustness run behaves exactly as it did before this existed.
#   attack           none | sign_flip | scaled | gaussian | label_flip
#                    sign_flip/scaled/gaussian poison the *update* after honest training
#                    (what Krum/FedTrimmedAvg/FedMedian defend against); label_flip
#                    poisons the *data* before it, so the update is well-formed and
#                    aggregation-level defences have far less grip. A robustness claim has
#                    to name which of the two it was tested against.
#   attack-fraction  share of clients compromised; the lowest ceil(f*K) partition ids,
#                    fixed rather than resampled per round so the result file identifies
#                    exactly who attacked.
#   attack-scale     amplification for sign_flip/scaled, noise multiple for gaussian.
#
# NOT to be confused with `num-malicious-nodes` above, which is Krum's own hyperparameter
# -- how many Byzantine clients Krum should *assume* -- and makes nobody misbehave.
attack = "none"
attack-fraction = 0.0
attack-scale = 1.0

# Run-level.
num-rounds = 2
seed = 0
deterministic = true
output-dir = "results/fl"
checkpoint-dir = "results/fl/_checkpoints"
