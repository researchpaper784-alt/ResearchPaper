[project]
name = "fedswarm"
version = "0.0.1"
description = "FedSwarm: Adaptive Aggregation Optimization in Federated Learning using Swarm Intelligence for Brain Tumor Diagnosis"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
dependencies = [
  "flwr==1.36.0",
  "flwr-datasets[vision]==0.5.0",
  "torch==2.2.2",
  "torchvision==0.17.2",
  "numpy>=1.26,<2",
  "scipy==1.14.1",
  "scikit-learn==1.5.2",
  "pandas==2.2.3",
  "pyyaml==6.0.2",
  "omegaconf==2.3.0",
  "matplotlib==3.9.2",
  "seaborn==0.13.2",
  "tqdm==4.67.1",
  "rich>=14.0.0,<15.0.0",
  "pillow==11.0.0",
  "imagehash==4.3.1",
  "kaggle==1.6.17",
]

[project.optional-dependencies]
dev = [
  "pytest==8.3.4",
  "ruff==0.8.4",
  "mypy==1.13.0",
]
# `flwr[simulation]` pulls in `ray`, which ships no wheel for Intel macOS
# (verified 2026-09-14: `ray==2.55.1` has manylinux + macOS-arm64 + win wheels
# only). Install this extra in the actual training environment (Colab/Kaggle,
# both Linux) with: uv pip install -e ".[simulation]"
simulation = [
  "flwr[simulation]==1.36.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fedswarm"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
